name: diedro_viewer
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.5.2
  code_assets: ^2.1.0
  ffi: ^2.2.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5
  path_provider: ^2.1.6
  vector_math: ^2.4.3
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: app.diedro.visor
  assets:
    - build/shaderbundles/datum.shaderbundle
  shaders:
    - fx/edl.frag

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon_square.png"
  image_path: "assets/icon/icon_square.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#12606A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#0A1214"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0A1214"
    image: assets/icon/splash_logo_android12.png
  ios: true
  android: true
  fullscreen: false
